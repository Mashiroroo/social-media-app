services:
  web:
    container_name: 'sosmed-web-backend'
    build: .
    env_file:
      - app.env
    ports:
      - "3000:3000"
    command: ./main -b 0.0.0.0
    depends_on:
      - db
  db:
    container_name: 'sosmed-postgres'
    image: postgres:16-alpine
    env_file:
      - app.env
    environment:
      - POSTGRES_USER=sma
      - POSTGRES_PASSWORD=RBBcmC33NEhTKSCz
      - POSTGRES_DB=sma
    volumes:
      - postgres-db:/var/lib/postgresql/data
  migrate:
    container_name: 'sosmed-migrate'
    image: migrate/migrate
    volumes:
      - ./migration:/migration
    command:
      - "-source"
      - "file:///migration"
      - "-database"
      - "postgres://sma:RBBcmC33NEhTKSCz@db:5432/sma?sslmode=disable"
      - "up"
    depends_on:
      - db

volumes:
  postgres-db:
